#hyprlockConfig

general {
	no_fade_in = false
	grace = 0
	disable_loading = false
}

background {
	monitor =
	path = /home/v/Wallpapers/miku.jpg
	color = rgba(25, 20, 20, 1.0)
	blur_passes = 2
}

input-field {
	monitor =
	size = 200, 50
	outline_thickness = 3
	dots_size = 0.33
	dots_spacing = 0.15
	dots_center = true
	outer_color = rgb(151515)
	inner_color = rgb(200, 200, 200)
	font_color = rgb(10, 10, 10)
	fade_on_empty = false
	placeholder_text = <i>Password...</i>
	hideT_input = false
	position = 0, -200
	haling = center
	valing = center
}

image {
	monitor = 
	path = /home/v/Pictures/Miku.jpg
	size = 300
	rounding = -1
	
	#borders 
	border_size = 6
	border_color = rgb(55, 59, 62)

	#position
	haling = center
	valing = center
	possition = 0, -60

}
label {
    monitor =
    # This runs a script to fetch the current artist and title from Spotify
    text = cmd[update:1000] echo "$(playerctl -p spotify metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo 'No media playing')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = bottom
}
