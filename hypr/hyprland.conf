# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua


#MONITOR

monitor=,preffered,auto,auto

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher


bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu 
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, mouse_left, workspace, e-1
bind = $mainMod, mouse_right, workspace, e+1x
#bindl = , switch:Lid Switch, exec, hyprlock -q

#execonce
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hyprlauncher -d
exec-once = hypridle
exec-once = hyprlock
exec-once = fastfetch -d

bind = $mainMod, F, fullscreen, 1

#bindWorkSpace

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to a workspace with mainMod + CONTROL + [0-9]
bind = $mainMod+$control, $w1, movetoworkspace, 1
bind = $mainMod+$control, $w2, movetoworkspace, 2
bind = $mainMod+$control, $w3, movetoworkspace, 3
bind = $mainMod+$control, $w4, movetoworkspace, 4
bind = $mainMod+$control, $w5, movetoworkspace, 5
bind = $mainMod+$control, $w6, movetoworkspace, 6

#bindl
bindl =, switch:on:Lid Switch, exec, hyprlock --inmediate
bindl =, switch:on:Lid Switch, exec, systemctl suspend 

#audiobindl

# Mute audio (l = works even when the screen is locked)
bindl = , code:121, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Decrease volume by 5% (e = repeats smoothly if you hold the key down)
bindle = , code:122, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Increase volume by 5% (capped at 100% max so you don't blow your speakers)
bindle = , code:123, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

#brightbindl

# Decrease brightness by 5% 
bindle = , code:232, exec, brightnessctl set 5%-
# Increase brightness by 5%
bindle = , code:233, exec, brightnessctl set +5%

#generalconfigs

general{
	
	gaps_in = 5
	gaps_out = 20
	border_size = 2

	col.active_border = rgba(34ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)

	resize_on_border = false

	allow_tearing = false

	layout = dwindle
}

#wayland

xwayland {
	force_zero_scaling = true
}

general {
	gaps_in = 7
	gaps_out = 7
		}

input {
    follow_mouse = 1

    touchpad {
        natural_scroll = false

        disable_while_typing = false  # <-- THIS IS THE CURE
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

decoration {
	rounding = 6
	}

#cursor
env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_SIZE, 24

